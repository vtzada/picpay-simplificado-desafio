services:
  postgres:
    image: postgres:16-alpine
    container_name: picpay_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=picpay_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: